name: gettic
description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  intl: ^0.19.0
  
  # --- State Management (main.dart için zorunlu) ---
  flutter_riverpod: ^2.5.1
  
  # --- UI & Font (theme.dart için zorunlu) ---
  google_fonts: ^6.2.1
  
  # --- Profil Avatar Önbelleği (profile_page.dart için) ---
  cached_network_image: ^3.3.1
  
  # --- Güvenli Depolama (Supabase Auth Token'ları için) ---
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
