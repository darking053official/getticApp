name: gettic
description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # --- Backend & Auth ---
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.0.0
  
  # --- UI & Utilities ---
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  
  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Platform Uyumluluğu ---
  shared_preferences: 2.2.3
  path_provider: 2.1.4

  # --- Push Notification (OneSignal) ---
  onesignal_flutter: ^5.6.8

  # --- Medya Paylaşımı ---
  file_picker: ^8.0.0
  record: ^5.2.0
  just_audio: ^0.9.40
  mime: ^1.0.6
  video_player: ^2.8.6
  chewie: ^1.8.0
  open_filex: ^4.3.4
  emoji_text_field: ^1.0.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  cryptography_flutter: 2.3.2
  flutter_webrtc: ^0.11.6+hotfix.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  local_notifier: ^0.1.6
  webview_flutter: ^4.7.0
  url_launcher: ^6.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/main_logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "assets/main_logo.png"
  windows:
    generate: true
    image_path: "assets/main_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/main_logo.png"

flutter_native_splash:
  color: "#0a0a0f"
  image: "assets/logo.png"
  android_12:
    color: "#0a0a0f"
    image: "assets/logo.png"
    icon_background_color: "#0a0a0f"
  android: true
  ios: false
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google.png
    - assets/github.png
    - assets/qr.png
    - assets/main_logo.png
    - assets/getticnotebook_logo.png
    - assets/getticpass_logo.png
    - assets/getticmeet_logo.png
    - assets/ringtone.ogg
    - assets/ringback.ogg
    - assets/notification.ogg
    
dependency_overrides:
  # Windows: flutter_secure_storage_windows 4.x ATL (atlstr.h) gerektiriyor.
  # 3.x sürümü ATL olmadan (win32 / FFI) derlenir.
  flutter_secure_storage_windows: 3.1.2
  record: 5.1.0
  record_android: 1.2.1
  record_platform_interface: 1.0.2
  record_linux: 0.7.1
  record_web: 1.1.0
  record_windows: 1.0.2
  record_darwin: 1.0.1
