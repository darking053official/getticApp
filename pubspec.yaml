name: gettic
description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # --- Backend & Auth ---
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.0.0
  
  # --- UI & Utilities ---
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  emoji_picker_flutter: ^2.1.1
  
  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Platform Uyumluluğu ---
  shared_preferences: 2.2.3
  path_provider: 2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter_native_splash:
  color: "#0a0a0f"
  image: "assets/logo.png"
  android_12:
    color: "#0a0a0f"
    image: "assets/logo.png"
    icon_background_color: "#0a0a0f"
  android: true
  ios: false
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google.png
    - assets/github.png
    - assets/qr.png

# ==========================================
# PLATFORM BUILD UYUMLULUĞU (dependency_overrides)
# ==========================================
dependency_overrides:
  # R8 "sealed class" hatasını çözmek için record paketleri
  record: 5.1.0
  record_android: 1.2.1
  record_platform_interface: 1.0.2
  record_linux: 0.7.1
  record_web: 1.1.0
  record_windows: 1.0.2
  record_darwin: 1.0.1
