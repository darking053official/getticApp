name: Build Gettic - All Platforms

on:
  push:
    branches: [ main ]
    # v1.0.3 gibi bir etiket (tag) atınca GitHub Release otomatik oluşturulur
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

# Aynı branch'e art arda push gelirse eski derlemeyi iptal et
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # ANDROID BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build provenance (kaynak doğrulama) için
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Setup Android
        run: |
          flutter create . --project-name gettic --org com.gettic --platforms=android
          
          sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle || true
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Temel izinleri ekle
          for perm in \
            "android.permission.INTERNET" \
            "android.permission.CAMERA" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.READ_EXTERNAL_STORAGE" \
            "android.permission.READ_MEDIA_IMAGES" \
            "android.permission.READ_MEDIA_VIDEO" \
            "android.permission.READ_MEDIA_AUDIO" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.SCHEDULE_EXACT_ALARM" \
            "android.permission.USE_EXACT_ALARM"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest /a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done
          
          # Android 13+ için özel WRITE_EXTERNAL_STORAGE
          if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi
          
          sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          rm -f test/widget_test.dart

      # Opsiyonel: GitHub Secrets tanımlıysa APK sabit anahtarla imzalanır.
      # Tanımlı değilse eskisi gibi debug anahtarıyla imzalanır.
      # Neden önemli: debug anahtarı her CI çalışmasında yeniden üretilir,
      # bu yüzden her derleme farklı imzalı olur ve telefondaki uygulamanın
      # üzerine "güncelleme" olarak kurulamaz.
      # Gerekli secret'lar: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret tanımlı değil. APK debug anahtarıyla imzalanacak (güncelleme olarak kurulamaz)."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()

          if 'keystoreProperties' not in s:
              props = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              s, n1 = re.subn(r'^android \{', lambda m: props + m.group(0), s, count=1, flags=re.M)

              signing = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
              )
              s, n2 = re.subn(r'^    buildTypes \{', lambda m: signing + m.group(0), s, count=1, flags=re.M)

              assert n1 == 1 and n2 == 1, 'build.gradle şablonu beklenenden farklı, imzalama eklenemedi'
              assert 'signingConfig signingConfigs.debug' in s, 'release signingConfig satırı bulunamadı'
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              open(p, 'w', encoding='utf-8').write(s)
              print('Release imzalama yapılandırıldı.')
          PY
          
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release --split-per-abi

      # Dosyanın bu repodaki hangi commit'ten üretildiğini kanıtlar.
      # Özel (private) repoda desteklenmeyebilir; derlemeyi bozmaz.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/app/outputs/flutter-apk/*-release.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ==========================================
  # WINDOWS BUILD
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # build provenance (kaynak doğrulama) için
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Setup Windows
        run: |
          flutter config --enable-windows-desktop
          flutter create . --project-name gettic --org com.gettic --platforms=windows
          Remove-Item -Path test/widget_test.dart -ErrorAction SilentlyContinue
          
          $flutterRoot = (Get-Command flutter).Source | Split-Path | Split-Path
          $files = @("packages\flutter_tools\lib\src\windows\build_windows.dart", "packages\flutter_tools\lib\src\windows\visual_studio.dart")
          foreach ($f in $files) {
            $p = Join-Path $flutterRoot $f
            if (Test-Path $p) {
              (Get-Content $p -Raw) -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022' | Set-Content $p -NoNewline
            }
          }
          $cacheDir = Join-Path $flutterRoot "bin\cache"
          Remove-Item -Path "$cacheDir\flutter_tools.stamp" -ErrorAction SilentlyContinue
          Remove-Item -Path "$cacheDir\flutter_tools.snapshot" -ErrorAction SilentlyContinue
          
      - name: Disable flutter_secure_storage for Windows
        run: |
          if (Test-Path "pubspec.yaml") {
            $content = Get-Content pubspec.yaml -Raw
            $content = $content -replace "flutter_secure_storage: \^9\.0\.0", "# flutter_secure_storage: ^9.0.0"
            Set-Content pubspec.yaml -Value $content -NoNewline
          }
          flutter pub get
          
      - run: flutter build windows --release

      # Opsiyonel: secret'lar tanımlıysa EXE ve DLL'ler imzalanır.
      # İmzasız EXE, Windows SmartScreen'de "bilinmeyen yayıncı" uyarısı verir.
      # Gerekli secret'lar: WINDOWS_CERT_BASE64 (.pfx dosyasının base64'ü), WINDOWS_CERT_PASSWORD
      # Not: Sertifika .pfx olarak dışa aktarılabilmelidir (donanım token'lı EV sertifikalar CI'da kullanılamaz).
      - name: Sign Windows binaries (optional)
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64)) {
            Write-Host "::warning::WINDOWS_CERT_BASE64 secret tanımlı değil. EXE imzasız olacak (SmartScreen uyarısı verir)."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe bulunamadı" }

          $targets = Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse -Include *.exe,*.dll
          foreach ($t in $targets) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "İmzalama başarısız: $($t.Name)" }
          }

          Remove-Item $pfx -Force
          Write-Host "Windows ikili dosyaları imzalandı."

      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath gettic-windows.zip

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: gettic-windows.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-windows
          path: gettic-windows.zip

  # ==========================================
  # MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write       # build provenance (kaynak doğrulama) için
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Setup macOS
        run: |
          flutter config --enable-macos-desktop
          flutter create . --project-name gettic --org com.gettic --platforms=macos
          rm -f test/widget_test.dart
          
          find macos -name "*.pbxproj" -exec sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' {} \;
          if [ -f "macos/Podfile" ]; then
            sed -i '' "s/platform :osx, .*/platform :osx, '10.15'/" macos/Podfile
          fi

      # macOS uygulamaları sandbox içinde çalışır. Varsayılan Release
      # entitlements dosyasında ağ izni YOKTUR; eklenmezse release sürümde
      # Supabase'e bağlanılamaz. Dosya seçici ve mikrofon için de izin eklenir.
      - name: Configure macOS entitlements
        run: |
          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "$f" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.audio-input bool true" "$f" || true
          done
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string \"Sesli mesaj gondermek icin mikrofon gerekli\"" macos/Runner/Info.plist || true
          
      - run: flutter pub get
      - run: flutter build macos --release

      # Opsiyonel: secret'lar tanımlıysa uygulama imzalanır ve Apple tarafından notarize edilir.
      # Bu olmadan macOS "geliştirici doğrulanamadı / uygulama hasarlı" uyarısı verir.
      # Gerekli secret'lar (Apple Developer Program üyeliği gerekir):
      #   MACOS_CERT_BASE64      -> "Developer ID Application" sertifikasının .p12 dosyasının base64'ü
      #   MACOS_CERT_PASSWORD    -> .p12 şifresi
      #   MACOS_SIGN_IDENTITY    -> örn: Developer ID Application: Ad Soyad (TEAMID)
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD -> notarization için (app-specific password)
      - name: Sign and notarize macOS app (optional)
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_BASE64" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::warning::macOS imzalama secret'ları tanımlı değil. Uygulama imzasız/notarize edilmemiş olacak (Gatekeeper uyarısı verir)."
            exit 0
          fi

          APP="build/macos/Build/Products/Release/gettic.app"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            OUT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait 2>&1) || true
            echo "$OUT"
            if ! echo "$OUT" | grep -q "status: Accepted"; then
              echo "::error::Notarization başarısız oldu. Yukarıdaki çıktıya bakın."
              exit 1
            fi
            xcrun stapler staple "$APP"
            echo "Uygulama imzalandı ve notarize edildi."
          else
            echo "::warning::APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD tanımlı değil. Uygulama imzalandı ama notarize edilmedi."
          fi

          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      # ditto: imzalı .app paketlerini (sembolik bağlar, öznitelikler) bozmadan sıkıştırır.
      - run: |
          cd build/macos/Build/Products/Release/
          ditto -c -k --sequesterRsrc --keepParent gettic.app gettic-macos.zip

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/macos/Build/Products/Release/gettic-macos.zip
          
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-macos
          path: build/macos/Build/Products/Release/gettic-macos.zip

  # ==========================================
  # LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build provenance (kaynak doğrulama) için
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev fuse libfuse2 libsecret-1-dev libjsoncpp-dev
      
      - name: Create Fake file_selector_linux Package
        run: |
          mkdir -p fake_file_selector_linux/lib
          cat > fake_file_selector_linux/pubspec.yaml << 'EOF'
          name: file_selector_linux
          description: Fake file_selector_linux for Linux build
          version: 0.9.3+2
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: '>=3.0.0'
          dependencies:
            flutter:
              sdk: flutter
            file_selector_platform_interface: ^2.6.2
          flutter:
            plugin:
              implements: file_selector_linux
              platforms:
                linux:
                  dartPluginClass: FileSelectorLinux
          EOF
          cat > fake_file_selector_linux/lib/file_selector_linux.dart << 'EOF'
          import 'package:file_selector_platform_interface/file_selector_platform_interface.dart';

          class FileSelectorLinux extends FileSelectorPlatform {
            static void registerWith() {
              FileSelectorPlatform.instance = FileSelectorLinux();
            }

            @override
            Future<XFile?> openFile({
              List<XTypeGroup>? acceptedTypeGroups,
              String? initialDirectory,
              String? confirmButtonText,
            }) async {
              throw UnimplementedError('File selection not supported on Linux build');
            }

            @override
            Future<List<XFile>> openFiles({
              List<XTypeGroup>? acceptedTypeGroups,
              String? initialDirectory,
              String? confirmButtonText,
            }) async {
              throw UnimplementedError('File selection not supported on Linux build');
            }

            @override
            Future<String?> getSavePath({
              List<XTypeGroup>? acceptedTypeGroups,
              String? initialDirectory,
              String? suggestedName,
              String? confirmButtonText,
            }) async {
              throw UnimplementedError('Save dialog not supported on Linux build');
            }

            @override
            Future<String?> getDirectoryPath({
              String? initialDirectory,
              String? confirmButtonText,
            }) async {
              throw UnimplementedError('Directory selection not supported on Linux build');
            }
          }
          EOF
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Setup Linux
        run: |
          flutter config --enable-linux-desktop
          flutter create . --project-name gettic --org com.gettic --platforms=linux
          rm -f test/widget_test.dart
          
      - name: Add dependency overrides
        run: |
          if ! grep -q "url_launcher_linux:" pubspec.yaml; then
            if grep -q "^dependency_overrides:" pubspec.yaml; then
              sed -i '/^dependency_overrides:/a \  url_launcher_linux: 3.0.6\n  file_selector_linux:\n    path: ./fake_file_selector_linux' pubspec.yaml
            else
              echo "" >> pubspec.yaml
              echo "dependency_overrides:" >> pubspec.yaml
              echo "  url_launcher_linux: 3.0.6" >> pubspec.yaml
              echo "  file_selector_linux:" >> pubspec.yaml
              echo "    path: ./fake_file_selector_linux" >> pubspec.yaml
            fi
          fi
          
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Disable -Werror for Linux Build
        run: |
          CMAKE_FILE="linux/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            sed -i 's/target_compile_options(${TARGET} PRIVATE -Wall -Werror/target_compile_options(${TARGET} PRIVATE -Wall -Wno-error/' "$CMAKE_FILE"
          fi
          
      - run: dart run flutter_native_splash:create
      
      - name: Build Linux
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release
          
      - name: Create AppImage
        run: |
          set -e
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          cat > $APPDIR/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          EOF
          cp $APPDIR/gettic.desktop $APPDIR/usr/share/applications/
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $APPDIR/gettic.png
            cp assets/logo.png $APPDIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          cat > $APPDIR/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/gettic" "$@"
          EOF
          chmod +x $APPDIR/AppRun
          # FUSE gerektirmeden çalışsın (CI ortamında daha güvenilir)
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $APPDIR gettic-linux-x86_64.AppImage
          
      - name: Create DEB Package
        run: |
          set -e
          # Sürümü pubspec.yaml'dan al (1.0.2+3 -> 1.0.2)
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//; s/+.*//')
          echo "DEB sürümü: $VERSION"
          DEB_DIR=gettic-deb
          mkdir -p $DEB_DIR/DEBIAN $DEB_DIR/usr/bin $DEB_DIR/usr/lib/gettic $DEB_DIR/usr/share/applications $DEB_DIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $DEB_DIR/usr/lib/gettic/
          cat > $DEB_DIR/usr/bin/gettic << 'EOF'
          #!/bin/bash
          exec /usr/lib/gettic/gettic "$@"
          EOF
          chmod +x $DEB_DIR/usr/bin/gettic
          cat > $DEB_DIR/usr/share/applications/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=/usr/bin/gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          EOF
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $DEB_DIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          cat > $DEB_DIR/DEBIAN/control << EOF
          Package: gettic
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: darking053 <writetome@gettic.dpdns.org>
          Description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
          Depends: libgtk-3-0, libblkid1, liblzma5, libsecret-1-0
          EOF
          chmod 755 $DEB_DIR/DEBIAN
          chmod 644 $DEB_DIR/DEBIAN/control
          dpkg-deb --build $DEB_DIR gettic-linux-amd64.deb

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            gettic-linux-x86_64.AppImage
            gettic-linux-amd64.deb
          
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-appimage
          path: gettic-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-deb
          path: gettic-linux-amd64.deb

  # ==========================================
  # CHECKSUM + (etiket varsa) GITHUB RELEASE
  # ==========================================
  # Tüm platformlar başarılı olunca çalışır.
  # - SHA256SUMS.txt üretir (kullanıcı indirdiği dosyayı doğrulayabilir)
  # - GPG secret'ı tanımlıysa SHA256SUMS.txt.asc imzasını da üretir
  # - v* etiketiyle tetiklendiyse GitHub Release oluşturup dosyaları yükler
  #   (Actions artifact'leri 90 günde silinir, Release dosyaları kalıcıdır)
  # Opsiyonel secret'lar: GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE
  release:
    name: Checksums and Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gettic-*
          path: dist
          merge-multiple: true

      - name: Create SHA256 checksums
        run: |
          cd dist
          ls -la
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### SHA256 değerleri"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign checksums with GPG (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::GPG_PRIVATE_KEY secret tanımlı değil, SHA256SUMS.txt imzalanmayacak."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign SHA256SUMS.txt
          ls -la SHA256SUMS.txt.asc

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: gettic-checksums
          path: |
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.asc
          if-no-files-found: ignore

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md << 'EOF'
          ## Dosyayı doğrulama

          İndirdiğin dosyanın değişmediğini kontrol etmek için, dosyaların bulunduğu klasörde:

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          Windows (PowerShell): `Get-FileHash dosya.zip -Algorithm SHA256` çıktısını `SHA256SUMS.txt` ile karşılaştır.
          macOS: `shasum -a 256 dosya.zip`

          Dosyalar bu depodaki derlemeye bağlı olarak GitHub tarafından da kaydedilir (build provenance):
          `gh attestation verify <dosya> --repo ${{ github.repository }}`
          EOF
          FILES=(dist/*)
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gettic $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            || gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
