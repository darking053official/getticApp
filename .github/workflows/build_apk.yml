name: Build Gettic - All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # ANDROID BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=android
      
      - name: Update Kotlin Version
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.23"/' android/settings.gradle.kts
          fi
      
      - name: Set Min SDK Version
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 21/' android/app/build.gradle.kts
          fi
      
      - name: Set Application ID
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts
          fi
      
      - name: Add All Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for perm in "android.permission.INTERNET" "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.READ_MEDIA_IMAGES"; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<manifest /a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
              fi
            done
            if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
            fi
          fi
      
      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          fi
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Apply Splash Screen
        run: dart run flutter_native_splash:create
        continue-on-error: true
      
      - name: Build Android APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
      
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
      
      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  # ==========================================
  # WINDOWS BUILD
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      # Visual Studio 2022'yi kullan (2019 yerine)
      FLUTTER_WINDOWS_VS_VERSION: '2022'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=windows
      
      - name: Remove Default Test
        run: Remove-Item -Path test/widget_test.dart -ErrorAction SilentlyContinue
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build Windows
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release
      
      - name: Zip Windows Build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath gettic-windows.zip
      
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gettic-windows
          path: gettic-windows.zip
          retention-days: 30

  # ==========================================
  # MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=macos
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build macOS
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release
      
      - name: Zip macOS Build
        run: |
          cd build/macos/Build/Products/Release/
          zip -r gettic-macos.zip gettic.app
      
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gettic-macos
          path: build/macos/Build/Products/Release/gettic-macos.zip
          retention-days: 30

  # ==========================================
  # LINUX BUILD (AppImage + .deb)
  # ==========================================
  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          sudo apt-get install -y fuse libfuse2
          # flutter_secure_storage_linux için gerekli
          sudo apt-get install -y libsecret-1-dev libjsoncpp-dev
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=linux
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build Linux
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release
      
      - name: List Build Files
        run: ls -lh build/linux/x64/release/bundle/
      
      # ==========================================
      # APPIMAGE OLUŞTUR
      # ==========================================
      - name: Create AppImage
        run: |
          set -e
          
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin
          mkdir -p $APPDIR/usr/share/applications
          mkdir -p $APPDIR/usr/share/icons/hicolor/256x256/apps
          
          cp -r build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          
          cat > $APPDIR/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          Comment=Gizlilik odaklı mesajlaşma
          Terminal=false
          EOF
          cp $APPDIR/gettic.desktop $APPDIR/usr/share/applications/
          
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $APPDIR/gettic.png
            cp assets/logo.png $APPDIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          
          cat > $APPDIR/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/gettic" "$@"
          EOF
          chmod +x $APPDIR/AppRun
          
          ARCH=x86_64 ./appimagetool $APPDIR gettic-linux-x86_64.AppImage
          
          ls -lh gettic-linux-x86_64.AppImage
      
      # ==========================================
      # .DEB PAKETİ OLUŞTUR
      # ==========================================
      - name: Create .deb Package
        run: |
          set -e
          
          DEB_DIR=gettic-deb
          mkdir -p $DEB_DIR/DEBIAN
          mkdir -p $DEB_DIR/usr/bin
          mkdir -p $DEB_DIR/usr/lib/gettic
          mkdir -p $DEB_DIR/usr/share/applications
          mkdir -p $DEB_DIR/usr/share/icons/hicolor/256x256/apps
          
          cp -r build/linux/x64/release/bundle/* $DEB_DIR/usr/lib/gettic/
          
          cat > $DEB_DIR/usr/bin/gettic << 'EOF'
          #!/bin/bash
          exec /usr/lib/gettic/gettic "$@"
          EOF
          chmod +x $DEB_DIR/usr/bin/gettic
          
          cat > $DEB_DIR/usr/share/applications/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=/usr/bin/gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          Comment=Gizlilik odaklı mesajlaşma
          Terminal=false
          EOF
          
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $DEB_DIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          
          cat > $DEB_DIR/DEBIAN/control << 'EOF'
          Package: gettic
          Version: 1.1.0
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: darking053 <support@gettic.app>
          Description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
           Modern, hızlı ve güvenli mesajlaşma deneyimi.
          Depends: libgtk-3-0, libblkid1, liblzma5, libsecret-1-0
          EOF
          
          chmod 755 $DEB_DIR/DEBIAN
          chmod 644 $DEB_DIR/DEBIAN/control
          
          dpkg-deb --build $DEB_DIR gettic-linux-amd64.deb
          
          ls -lh gettic-linux-amd64.deb
      
      # ==========================================
      # ARTIFACT'LARI YÜKLE
      # ==========================================
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-appimage
          path: gettic-linux-x86_64.AppImage
          retention-days: 30
      
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-deb
          path: gettic-linux-amd64.deb
          retention-days: 30
      
      - name: Upload Linux ZIP (Fallback)
        run: |
          cd build/linux/x64/release/
          zip -r gettic-linux.zip bundle/
      
      - name: Upload Linux ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-zip
          path: build/linux/x64/release/gettic-linux.zip
          retention-days: 30
