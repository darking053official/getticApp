name: Build Gettic - All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # ANDROID BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=android
      
      - name: Update Kotlin Version
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.23"/' android/settings.gradle.kts
          fi
      
      - name: Set Min SDK Version
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 21/' android/app/build.gradle.kts
          fi
      
      - name: Set Application ID
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts
          fi
      
      - name: Add All Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for perm in "android.permission.INTERNET" "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.READ_MEDIA_IMAGES"; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<manifest /a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
              fi
            done
            if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
            fi
          fi
      
      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          fi
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Apply Splash Screen
        run: dart run flutter_native_splash:create
        continue-on-error: true
      
      - name: Build Android APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
      
      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/
      
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
      
      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  # ==========================================
  # WINDOWS BUILD
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=windows
      
      - name: Remove Default Test
        run: Remove-Item -Path test/widget_test.dart -ErrorAction SilentlyContinue
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build Windows
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release
      
      - name: List Build Files
        run: Get-ChildItem -Path build/windows/x64/runner/Release/ | Format-Table
      
      - name: Zip Windows Build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath gettic-windows.zip
      
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gettic-windows
          path: gettic-windows.zip
          retention-days: 30

  # ==========================================
  # MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=macos
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build macOS
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release
      
      - name: Zip macOS Build
        run: |
          cd build/macos/Build/Products/Release/
          zip -r gettic-macos.zip gettic.app
          ls -lh gettic-macos.zip
      
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gettic-macos
          path: build/macos/Build/Products/Release/gettic-macos.zip
          retention-days: 30

  # ==========================================
  # LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=linux
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build Linux
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release
      
      - name: List Build Files
        run: ls -lh build/linux/x64/release/bundle/
      
      - name: Zip Linux Build
        run: |
          cd build/linux/x64/release/
          zip -r gettic-linux.zip bundle/
          ls -lh gettic-linux.zip
      
      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gettic-linux
          path: build/linux/x64/release/gettic-linux.zip
          retention-days: 30
