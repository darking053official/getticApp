name: Build Gettic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      # Proje adı 'gettic' olarak oluşturuluyor
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic
      
      - name: Set Application ID
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts 2>/dev/null || true
          fi
      
      - name: Add Internet Permission to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
          fi
      
      - name: Get dependencies
        run: flutter pub get

      # Logoyu uygula
      - name: Apply Gettic Logo
        run: dart run flutter_launcher_icons

      # Uygulama adını 'Gettic' yap
      - name: Set App Name to Gettic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          fi
      
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gettic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
