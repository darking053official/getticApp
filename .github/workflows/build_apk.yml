name: Build Gettic - All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # ANDROID BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=android
      
      - name: Update Kotlin Version
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.23"/' android/settings.gradle.kts
          fi
      
      - name: Set Min SDK Version
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 23/' android/app/build.gradle.kts
          fi
      
      - name: Set Application ID
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts
          fi
      
      - name: Add Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for perm in "android.permission.INTERNET" "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.READ_MEDIA_IMAGES" "android.permission.RECORD_AUDIO"; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<manifest /a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
              fi
            done
          fi
      
      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          fi
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Icons & Splash
        run: |
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
      
      - name: Build Android APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ==========================================
  # WINDOWS BUILD (ATL EKLENDİ)
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=windows
      
      - name: Remove Default Test
        run: Remove-Item -Path test/widget_test.dart -ErrorAction SilentlyContinue
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      # ✅ VS2022 YAMASI
      - name: Patch Flutter for Visual Studio 2022
        run: |
          $flutterRoot = (Get-Command flutter).Source | Split-Path | Split-Path
          $files = @(
            "packages\flutter_tools\lib\src\windows\build_windows.dart",
            "packages\flutter_tools\lib\src\windows\visual_studio.dart"
          )
          foreach ($f in $files) {
            $path = Join-Path $flutterRoot $f
            if (Test-Path $path) {
              $c = Get-Content $path -Raw
              $c = $c -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
              Set-Content -Path $path -Value $c -NoNewline
            }
          }
          $cacheDir = Join-Path $flutterRoot "bin\cache"
          Remove-Item -Path (Join-Path $cacheDir "flutter_tools.stamp") -ErrorAction SilentlyContinue
          Remove-Item -Path (Join-Path $cacheDir "flutter_tools.snapshot") -ErrorAction SilentlyContinue
      
      # ✅ ATL BİLEŞENİNİ KUR
      - name: Install Visual Studio ATL Component
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsPath)) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Community" }
          if (-not (Test-Path $vsPath)) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\BuildTools" }
          if (Test-Path $vsPath) {
            $installer = "$vsPath\Common7\IDE\vs_installer.exe"
            if (Test-Path $installer) {
              Write-Host "ATL kuruluyor..."
              Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart" -Wait
              Write-Host "✅ ATL kuruldu"
            }
          }
      
      - name: Build Windows
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release
      
      - name: Zip Windows Build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath gettic-windows.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-windows
          path: gettic-windows.zip

  # ==========================================
  # MACOS BUILD (DEPLOYMENT TARGET 10.15)
  # ==========================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=macos
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      # ✅ macOS DEPLOYMENT TARGET'I 10.15 YAP
      - name: Set macOS Deployment Target to 10.15
        run: |
          # Podfile'daki platform satırını güncelle
          PODFILE="macos/Podfile"
          if [ -f "$PODFILE" ]; then
            sed -i "s/^platform :osx, .*/platform :osx, '10.15'/" "$PODFILE"
            echo "✅ Podfile güncellendi"
            head -5 "$PODFILE"
          fi
          
          # Xcode projesindeki deployment target'ı güncelle
          find macos -name "*.pbxproj" -exec sed -i 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' {} \;
          echo "✅ Xcode projesi güncellendi"
      
      - name: Build macOS
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release
      
      - name: Zip macOS Build
        run: |
          cd build/macos/Build/Products/Release/
          zip -r gettic-macos.zip gettic.app
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-macos
          path: build/macos/Build/Products/Release/gettic-macos.zip

  # ==========================================
  # LINUX BUILD (FAKE PAKET YÖNTEMİ - DÜZELTİLDİ)
  # ==========================================
  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev fuse libfuse2 libsecret-1-dev libjsoncpp-dev
      
      # ✅ BOŞ PAKET OLUŞTUR
      - name: Create Fake file_selector_linux Package
        run: |
          mkdir -p fake_file_selector_linux/lib
          cat > fake_file_selector_linux/pubspec.yaml << 'EOF'
          name: file_selector_linux
          description: Fake package
          version: 0.9.3+2
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: '>=3.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            plugin:
              implements: file_selector_linux
              platforms:
                linux:
                  dartPluginClass: FileSelectorLinux
          EOF
          cat > fake_file_selector_linux/lib/file_selector_linux.dart << 'EOF'
          class FileSelectorLinux {
            static void registerWith() {}
          }
          EOF
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=linux
      
      - name: Remove Default Test
        run: rm -f test/widget_test.dart
      
      # ✅ pubspec.yaml'a override ekle (DUPLICATE ÖNLEME)
      - name: Add dependency override for file_selector_linux
        run: |
          # Eğer file_selector_linux override yoksa, dependency_overrides bloğuna ekle
          if ! grep -q "file_selector_linux:" pubspec.yaml; then
            # dependency_overrides bloğu var mı kontrol et
            if grep -q "^dependency_overrides:" pubspec.yaml; then
              # Varsa, altına file_selector_linux ekle
              sed -i '/^dependency_overrides:/a \  file_selector_linux:\n    path: ./fake_file_selector_linux' pubspec.yaml
            else
              # Yoksa, yeni blok oluştur
              echo "" >> pubspec.yaml
              echo "dependency_overrides:" >> pubspec.yaml
              echo "  file_selector_linux:" >> pubspec.yaml
              echo "    path: ./fake_file_selector_linux" >> pubspec.yaml
            fi
          fi
          echo "✅ pubspec.yaml güncellendi"
          grep -A2 "dependency_overrides" pubspec.yaml
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Apply Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      - name: Build Linux
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release
      
      - name: Create AppImage
        run: |
          set -e
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          cat > $APPDIR/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          EOF
          cp $APPDIR/gettic.desktop $APPDIR/usr/share/applications/
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $APPDIR/gettic.png
            cp assets/logo.png $APPDIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          cat > $APPDIR/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/gettic" "$@"
          EOF
          chmod +x $APPDIR/AppRun
          ARCH=x86_64 ./appimagetool $APPDIR gettic-linux-x86_64.AppImage
      
      - name: Create .deb Package
        run: |
          set -e
          DEB_DIR=gettic-deb
          mkdir -p $DEB_DIR/DEBIAN $DEB_DIR/usr/bin $DEB_DIR/usr/lib/gettic $DEB_DIR/usr/share/applications $DEB_DIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $DEB_DIR/usr/lib/gettic/
          cat > $DEB_DIR/usr/bin/gettic << 'EOF'
          #!/bin/bash
          exec /usr/lib/gettic/gettic "$@"
          EOF
          chmod +x $DEB_DIR/usr/bin/gettic
          cat > $DEB_DIR/usr/share/applications/gettic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gettic
          Exec=/usr/bin/gettic
          Icon=gettic
          Categories=Network;Chat;InstantMessaging;
          EOF
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png $DEB_DIR/usr/share/icons/hicolor/256x256/apps/gettic.png
          fi
          cat > $DEB_DIR/DEBIAN/control << 'EOF'
          Package: gettic
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: darking053 <support@gettic.app>
          Description: Gettic - Gizlilik odaklı mesajlaşma uygulaması
          Depends: libgtk-3-0, libblkid1, liblzma5, libsecret-1-0
          EOF
          chmod 755 $DEB_DIR/DEBIAN
          chmod 644 $DEB_DIR/DEBIAN/control
          dpkg-deb --build $DEB_DIR gettic-linux-amd64.deb
      
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-appimage
          path: gettic-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-linux-deb
          path: gettic-linux-amd64.deb
