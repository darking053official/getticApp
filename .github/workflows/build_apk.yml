name: Build Gettic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Create Android project structure
        run: |
          # Geçici bir Flutter projesi oluştur
          flutter create --project-name gettic_mobile --org com.gettic temp_project
          
          # Android klasörünü kopyala
          cp -r temp_project/android ./android
          
          # Diğer gerekli dosyaları kopyala
          cp temp_project/.metadata ./
          
          # Geçici projeyi sil
          rm -rf temp_project
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gettic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
