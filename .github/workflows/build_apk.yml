name: Build Gettic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Kodu al
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Java 17 kurulumu
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 3. Flutter 3.19.0 kurulumu
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      # 4. Flutter projesini hazırla (Android klasörü yoksa oluştur)
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=android
      
      # 5. Uygulama ID'sini ayarla (Hem Groovy hem Kotlin DSL desteği)
      - name: Set Application ID
        run: |
          # Groovy (build.gradle) - Eski format
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
            echo "✅ Groovy build.gradle güncellendi"
          fi
          
          # Kotlin DSL (build.gradle.kts) - Yeni format (Flutter 3.19+)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts
            echo "✅ Kotlin DSL build.gradle.kts güncellendi"
          fi
          
          # Sonucu doğrula
          echo "📦 Uygulama ID'si kontrol ediliyor:"
          grep -r "applicationId" android/app/ | head -5
      
      # 6. İnternet iznini manifest'e ekle
      - name: Add Internet Permission to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
              echo "✅ İnternet izni eklendi"
            else
              echo "ℹ️ İnternet izni zaten mevcut"
            fi
          fi
      
      # 7. Uygulama adını "Gettic" yap
      - name: Set App Name to Gettic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
            echo "✅ Uygulama adı Gettic olarak ayarlandı"
          fi
      
      # 8. Bağımlılıkları yükle
      - name: Get Dependencies
        run: flutter pub get
      
      # 9. Logo ve ikonları uygula
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true  # Logo yoksa build devam etsin
      
      # 10. Splash Screen (Açılış ekranı) - Sadece kuruluysa
      - name: Apply Splash Screen
        run: dart run flutter_native_splash:create
        continue-on-error: true  # Paket yoksa atla
      
      # 11. Kod analizi (opsiyonel, hata olursa durur)
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true  # Sadece log için, build'i durdurmasın
      
      # 12. Release APK üret
      - name: Build Release APK
        run: flutter build apk --release --split-per-abi
      
      # 13. Üretilen dosyaları listele (debug için)
      - name: List Generated APKs
        run: |
          echo "📦 Üretilen APK dosyaları:"
          ls -lh build/app/outputs/flutter-apk/
      
      # 14. APK'yı artifact olarak yükle
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gettic-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
