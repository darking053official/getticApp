name: Build Gettic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Kodu al
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Java 17 kurulumu
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 3. Flutter 3.19.2 kurulumu
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
      
      # 4. Flutter projesini hazırla
      - name: Ensure Flutter project structure
        run: flutter create . --project-name gettic --org com.gettic --platforms=android
      
      # 4.1. Kotlin sürümünü güncelle
      - name: Update Kotlin Version
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' "$SETTINGS_FILE"
            echo "✅ Kotlin sürümü güncellendi:"
            grep "org.jetbrains.kotlin.android" "$SETTINGS_FILE"
          fi
          SETTINGS_KTS_FILE="android/settings.gradle.kts"
          if [ -f "$SETTINGS_KTS_FILE" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.23"/' "$SETTINGS_KTS_FILE"
            echo "✅ Kotlin DSL sürümü güncellendi:"
            grep "org.jetbrains.kotlin.android" "$SETTINGS_KTS_FILE"
          fi
      
      # 4.2. minSdkVersion'ı 21 yap (emoji_picker_flutter için zorunlu)
      - name: Set Min SDK Version to 21
        run: |
          GRADLE_FILE="android/app/build.gradle"
          GRADLE_KTS_FILE="android/app/build.gradle.kts"
          
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$GRADLE_FILE"
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' "$GRADLE_FILE"
            echo "✅ Groovy minSdkVersion 21 yapıldı:"
            grep "minSdkVersion" "$GRADLE_FILE"
          fi
          
          if [ -f "$GRADLE_KTS_FILE" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' "$GRADLE_KTS_FILE"
            sed -i 's/minSdk = [0-9]*/minSdk = 21/' "$GRADLE_KTS_FILE"
            echo "✅ Kotlin DSL minSdk 21 yapıldı:"
            grep "minSdk" "$GRADLE_KTS_FILE"
          fi
      
      # 5. Uygulama ID'sini ayarla
      - name: Set Application ID
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = ".*"/applicationId = "gettic.by.darking053"/' android/app/build.gradle.kts
          fi
          echo "📦 Uygulama ID'si:"
          grep -r "applicationId" android/app/ | head -5
      
      # 6. TÜM İZİNLERİ EKLE
      - name: Add All Permissions to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
              echo "✅ INTERNET izni eklendi"
            fi
            if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
              echo "✅ CAMERA izni eklendi"
            fi
            if ! grep -q "android.permission.READ_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$MANIFEST"
              echo "✅ READ_EXTERNAL_STORAGE izni eklendi"
            fi
            if ! grep -q "android.permission.READ_MEDIA_IMAGES" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST"
              echo "✅ READ_MEDIA_IMAGES izni eklendi"
            fi
            if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
              echo "✅ WRITE_EXTERNAL_STORAGE izni eklendi"
            fi
            echo ""
            echo "📋 Manifest ilk 15 satır:"
            head -15 "$MANIFEST"
          fi
      
      # 7. Uygulama adını "Gettic" yap
      - name: Set App Name to Gettic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
            echo "✅ Uygulama adı Gettic olarak ayarlandı"
          fi
      
      # 8. Bağımlılıkları yükle
      - name: Get Dependencies
        run: flutter pub get
      
      # 9. Logo ve ikonları uygula
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true
      
      # 10. Splash Screen
      - name: Apply Splash Screen
        run: dart run flutter_native_splash:create
        continue-on-error: true
      
      # 11. Kod analizi
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      
      # 12. Release APK üret
      - name: Clean and Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi
      
      # 13. Üretilen dosyaları listele
      - name: List Generated APKs
        run: |
          echo "📦 Üretilen APK dosyaları:"
          ls -lh build/app/outputs/flutter-apk/
      
      # 14. APK'yı artifact olarak yükle
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gettic-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
