name: Android APK Derle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-derle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-derle:
    name: Android APK Derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true

      - name: Android projesini hazırla
        run: |
          flutter create . --project-name gettic --org com.gettic --platforms=android

          # Uygulama kimliği
          sed -i 's/applicationId ".*"/applicationId "gettic.by.darking053"/' android/app/build.gradle || true

          # Eklentilerin istediği NDK sürümü
          sed -i 's/^android {/android {\n    ndkVersion "25.1.8937393"/' android/app/build.gradle || true

          # Derleme ve hedef SDK sürümleri
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' android/app/build.gradle || true

          # Kotlin sürümü
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle || true

          # Gradle sarmalayıcı sürümü
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties || true

          # Android Gradle Eklentisi sürümü
          if [ -f android/build.gradle ]; then
            sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.2/" android/build.gradle || true
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.2.2"/' android/settings.gradle || true
          fi

          # R8/D8 sürümünü sabitle (dexleme hatalarını önler)
          if ! grep -q "android.r8.version" android/gradle.properties; then
            echo "android.r8.version=8.3.37" >> android/gradle.properties
          fi

          # Gerekli izinler
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for izin in \
            "android.permission.INTERNET" \
            "android.permission.CAMERA" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.READ_EXTERNAL_STORAGE" \
            "android.permission.READ_MEDIA_IMAGES" \
            "android.permission.READ_MEDIA_VIDEO" \
            "android.permission.READ_MEDIA_AUDIO" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.SCHEDULE_EXACT_ALARM" \
            "android.permission.USE_EXACT_ALARM"; do
            if ! grep -q "$izin" "$MANIFEST"; then
              sed -i "/<manifest /a \    <uses-permission android:name=\"$izin\" />" "$MANIFEST"
            fi
          done
          if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi

          # Uygulama adı
          sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"

          # Varsayılan test dosyasını kaldır
          rm -f test/widget_test.dart

      # ------------------------------------------------------------
      # Eklentilerde eksik "namespace" (AGP 8 zorunlu) düzeltmesi.
      # Koşulsuz eklenir. Değer eklentinin AndroidManifest paket adından alınır.
      # ------------------------------------------------------------
      - name: Eklenti namespace'lerini düzelt
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects { p ->
              p.plugins.withId('com.android.library') {
                  def ext = p.extensions.findByName('android')
                  if (ext != null && ext.namespace == null) {
                      def ns = 'com.gettic.plugins.' + p.name.replaceAll('[^A-Za-z0-9]', '_')
                      def manifest = new File(p.projectDir, 'src/main/AndroidManifest.xml')
                      if (manifest.exists()) {
                          def m = (manifest.text =~ /package="([^"]+)"/)
                          if (m.find()) { ns = m.group(1) }
                      }
                      ext.namespace = ns
                  }
              }
          }
          EOF

      - name: Ekran paylaşımı için yerel kod ekle
        run: |
          set -e
          KT_ROOT=android/app/src/main/kotlin
          ANA_DOSYA=$(find "$KT_ROOT" -name MainActivity.kt | head -n 1)
          PAKET=$(grep -m1 '^package ' "$ANA_DOSYA" | awk '{print $2}')
          HEDEF="$KT_ROOT/$(echo "$PAKET" | tr '.' '/')"
          mkdir -p "$HEDEF"
          grep -q "^class ScreenShareService " ci/android/ScreenShareService.kt || { echo "::error::ScreenShareService.kt eksik."; exit 1; }
          grep -q "^class MainActivity " ci/android/MainActivity.kt || { echo "::error::MainActivity.kt eksik."; exit 1; }
          for dosya in ScreenShareService.kt MainActivity.kt; do
            sed "s/^package .*/package $PAKET/" "ci/android/$dosya" > "$HEDEF/$dosya"
          done

      - name: Bildirim sesi ve klavye ayarını ekle
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/notification.ogg android/app/src/main/res/raw/notification.ogg
          cp assets/ringtone.ogg android/app/src/main/res/raw/ringtone.ogg
          python3 - << 'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'windowSoftInputMode' not in s:
              s = s.replace('<activity ', '<activity android:windowSoftInputMode="adjustResize" ', 1)
              open(m, 'w', encoding='utf-8').write(s)
          print('Klavye ayarı (adjustResize) uygulandı.')
          PY

      - name: Manifest ve Gradle dosyalarını düzenle
        run: |
          # Python betiğini base64 ile gömüyoruz (YAML heredoc sorununu önler)
          echo '' | base64 -d > /tmp/gradle_duzenle.py
          python3 /tmp/gradle_duzenle.py

      - name: Sürüm imzalamayı yapılandır (isteğe bağlı)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 tanımlı değil, APK hata ayıklama anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo '' | base64 -d > /tmp/imza_ayarla.py
          python3 /tmp/imza_ayarla.py

      - name: Çağrı zil sesini Android'e ekle
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/ringtone.ogg android/app/src/main/res/raw/ringtone.ogg

      - name: Bağımlılıkları getir
        run: flutter pub get

      - name: Uygulama simgelerini oluştur
        run: dart run flutter_launcher_icons

      - name: Açılış ekranını oluştur
        run: dart run flutter_native_splash:create

      - name: APK derle
        run: flutter build apk --release --split-per-abi

      - name: ARM64 APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: ARMv7 APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: x86_64 APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
