name: Build Gettic - All Platforms

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true

      - name: Setup Android
        run: |
          flutter create . --project-name gettic --org com.gettic --platforms=android

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

          NEW_PKG="gettic.by.darking053"
          NEW_DIR="android/app/src/main/kotlin/$(echo "$NEW_PKG" | tr '.' '/')"

          sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/" android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle || true

          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle || true
          sed -i 's/compileSdk [0-9]*/compileSdk 36/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' android/app/build.gradle || true

          if ! grep -q "android.aapt2Version" android/gradle.properties; then
            echo "" >> android/gradle.properties
            echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties
          fi

          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle || true

          OLD_MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)
          if [ -n "$OLD_MAIN" ]; then
            mkdir -p "$NEW_DIR"
            sed "s/^package .*/package $NEW_PKG/" "$OLD_MAIN" > "$NEW_DIR/MainActivity.kt"
            OLD_DIR=$(dirname "$OLD_MAIN")
            rm -rf "$OLD_DIR"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          for perm in \
            "android.permission.INTERNET" \
            "android.permission.CAMERA" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.MODIFY_AUDIO_SETTINGS" \
            "android.permission.BLUETOOTH" \
            "android.permission.BLUETOOTH_CONNECT" \
            "android.permission.READ_EXTERNAL_STORAGE" \
            "android.permission.READ_MEDIA_IMAGES" \
            "android.permission.READ_MEDIA_VIDEO" \
            "android.permission.READ_MEDIA_AUDIO" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.SCHEDULE_EXACT_ALARM" \
            "android.permission.USE_EXACT_ALARM" \
            "android.permission.FOREGROUND_SERVICE" \
            "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest /a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done

          if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi

          if grep -q '<activity' "$MANIFEST"; then
            if ! grep -q 'android:exported' "$MANIFEST"; then
              sed -i 's|<activity|<activity android:exported="true"|' "$MANIFEST"
            fi
          fi

          # Impeller'ı kapat (GPU kaynaklı release çökmelerine karşı)
          if ! grep -q "EnableImpeller" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>|' "$MANIFEST"
          fi

          sed -i 's/android:label=".*"/android:label="Gettic"/' "$MANIFEST"
          rm -f test/widget_test.dart

      - name: Add screen share native code
        run: |
          set -e
          NEW_PKG="gettic.by.darking053"
          DEST="android/app/src/main/kotlin/$(echo "$NEW_PKG" | tr '.' '/')"
          mkdir -p "$DEST"
          for f in ScreenShareService.kt MainActivity.kt; do
            if [ -f "ci/android/$f" ]; then
              sed "s/^package .*/package $NEW_PKG/" "ci/android/$f" > "$DEST/$f"
            fi
          done

      - name: Configure ProGuard + shared_preferences fix
        run: |
          RULES="android/app/proguard-rules.pro"
          cat > "$RULES" << 'PRO'
          # flutter_webrtc — JniZeroJni AAR'da yok, R8 hata vermesin [citation:2][citation:15]
          -keep class com.cloudwebrtc.webrtc.** { *; }
          -keep class org.webrtc.** { *; }
          -keep class org.jni_zero.** { *; }
          -dontwarn org.jni_zero.JniZeroJni
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          # Flutter kendi sınıfları
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          # shared_preferences JNI sınıfları (2.5.0/2.5.1 hatası için) [citation:1]
          -keep class io.flutter.plugins.sharedpreferences.** { *; }
          PRO

      - name: Patch gradle for R8 + screen share
        run: |
          python3 - << 'PY'
          import re

          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          for p in ['android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION']:
              if p not in s:
                  s = re.sub(r'(<manifest[^>]*>)', lambda mm: mm.group(1) + '\n    <uses-permission android:name="%s" />' % p, s, count=1)
          if 'ScreenShareService' not in s:
              service = '    <service android:name=".ScreenShareService" android:foregroundServiceType="mediaProjection" android:exported="false" />\n'
              s = s.replace('</application>', service + '</application>', 1)
          open(m, 'w', encoding='utf-8').write(s)

          g = 'android/app/build.gradle'
          t = open(g, encoding='utf-8').read()

          dep = '    implementation "androidx.core:core-ktx:1.12.0"'
          if 'androidx.core:core-ktx' not in t:
              if re.search(r'^dependencies \{', t, re.M):
                  t = re.sub(r'^dependencies \{', 'dependencies {\n' + dep, t, count=1, flags=re.M)
              else:
                  t += '\ndependencies {\n' + dep + '\n}\n'

          # R8'i tekrar aç, proguard-rules.pro bağla
          def patch_release(mm):
              body = mm.group(2)
              body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled true', body)
              body = re.sub(r'shrinkResources\s+\w+', 'shrinkResources true', body)
              if 'minifyEnabled' not in body:
                  body += "            minifyEnabled true\n"
              if 'shrinkResources' not in body:
                  body += "            shrinkResources true\n"
              if 'proguard-rules.pro' not in body:
                  body += "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
              return mm.group(1) + body + mm.group(3)

          t2 = re.sub(r'(\brelease\s*\{)(.*?)(\})', patch_release, t, count=1, flags=re.S)
          if t2 != t:
              t = t2
          open(g, 'w', encoding='utf-8').write(t)
          PY

      - name: Pin shared_preferences_android to 2.4.23
        run: |
          if grep -q "^dependency_overrides:" pubspec.yaml; then
            sed -i '/^dependency_overrides:/a \  shared_preferences_android: 2.4.23' pubspec.yaml
          else
            echo "" >> pubspec.yaml
            echo "dependency_overrides:" >> pubspec.yaml
            echo "  shared_preferences_android: 2.4.23" >> pubspec.yaml
          fi

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 tanımlı değil, debug imzası kullanılacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'keystoreProperties' not in s:
              props = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              s, n1 = re.subn(r'^android \{', lambda m: props + m.group(0), s, count=1, flags=re.M)
              signing = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
              )
              s, n2 = re.subn(r'^    buildTypes \{', lambda m: signing + m.group(0), s, count=1, flags=re.M)
              if n1 == 1 and n2 == 1 and 'signingConfig signingConfigs.debug' in s:
                  s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
                  open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: rm -f pubspec.lock
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gettic-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
